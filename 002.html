<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
</head>
<body>

    <!--
        <p></p> - tag para parágrafo
        <br> = quebra de linha (coloco aonde eu quiser que tenha um ENTER)
    -->

    <p>Olá mundo!<br>

    <!--
        >em></em> ênfase no texto
        <strong></strong> = destaque de texto indicando importância
    -->
    
    <em>Rayssa Facin</em></p>
    <p>Senac <strong>Americana</strong></p>

    <hr>

    <!--
        ul - lista mão ordenada
        ol - lista ordenada
    -->

    <ul>
        <!--
            <li> - itens da lista        
        -->

        <li>HTML - HyperText Markup Language</li>
        <li>CSS - Cascading Style Sheet</li>
        <li>JS - JavaScript</li>
        <li>Outro item</li>
    </ul>


    <hr>

    <!--
        <img> - inserir imagem
        src - local da imagem 
    -->

    <p style="background-color: red;">
        <img src="https://gutoffline.github.io/recursos/images/AULA_002/computador.jpg"> <br>
        <img src ="https://gutoffline.github.io/recursos/images/AULA_002/computador-transparente.png">
    </p>

    <p>O que eu aprendi aqui?<br>
        Aprendi a criar comentários, colocar imagens, criar listas, formatar com css o fundo de um parágrafo.
    </p>
</body>
</html>
